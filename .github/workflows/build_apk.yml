name: Build MaoneArt Gudang APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Rename & Prepare APK
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/release/app-release.apk output_apk/MaoneArt-Gudang-Release.apk || cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/MaoneArt-Gudang-Release.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Gudang-APK
          path: output_apk/MaoneArt-Gudang-Release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: 'MaoneArt Gudang v1.0.0 (APK Release)'
          body: |
            ## 📦 MaoneArt Inventaris & Gudang - Android Release APK
            
            Aplikasi mobile petugas lapangan untuk input cepat barang masuk & keluar langsung terhubung ke server kantor!
            
            ### ✨ Fitur Aplikasi:
            - **Input Barang Masuk**: Pilih supplier, nota surat jalan, multi-item barang.
            - **Input Barang Keluar**: Pilih PIC pengambil, divisi & keperluan, proteksi sisa stok.
            - **Tanya Si-nya (AI)**: Analisa stok realtime & minta draf laporan Excel/PDF.
            - **Konfigurasi Server URL**: Tekan lama (long-press) layar untuk ubah IP Server Kantor.
            
            📥 **Download APK di bawah ini dan instal di HP Android Anda!**
          files: output_apk/MaoneArt-Gudang-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
