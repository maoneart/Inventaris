name: Build MaoneArt Gudang Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK (Flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Universal Release APK
        run: |
          cd flutter_app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoneArt-Gudang-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: 'MaoneArt Gudang v1.0.0 (Flutter Release)'
          body: |
            ## 📦 MaoneArt Inventaris & Gudang - Android APK
            
            Aplikasi mobile petugas lapangan berbasis **Flutter** dengan tampilan minimalis, bersih, dan cepat.
            
            ### ✨ Fitur Aplikasi:
            - **Desain Minimalis & Bersih**: Sederhana, fokus pada input lapangan tanpa ornamen ramai.
            - **2 Aksi Utama**: Tombol simetris **Barang Masuk (Stock In)** & **Barang Keluar (Stock Out)**.
            - **Part Number & Supplier**: Informasi detail part number dan rekanan pengirim.
            - **Konfigurasi IP Server Fleksibel**: Klik ikon gerigi (pengaturan) untuk mengubah alamat IP server WiFi kantor.
            
            📥 **Download file APK di bawah ini dan pasang langsung di HP Android Anda!**
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
